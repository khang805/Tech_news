name: Tech news collector

on:
  schedule:
    # One run per day (UTC). 01:00 UTC = 06:00 Pakistan time. GitHub may start runs a few minutes late.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Digest period to send"
        type: choice
        options: [day, week, month]
        default: day
      test_email:
        description: "Only send a test email (skips collection)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsintel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Choose digest period (exactly one email per period)
        id: period
        env:
          EVENT: ${{ github.event_name }}
          MANUAL: ${{ inputs.period }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then P="$MANUAL"
          elif [ "$(date -u +%d)" = "01" ]; then P="month"
          elif [ "$(date -u +%u)" = "7" ]; then P="week"
          else P="day"; fi
          echo "period=$P" >> "$GITHUB_OUTPUT"
          echo "Digest period: $P"

      - name: Collect, label impact, send email, save to database, build website
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python -m newsintel --test-email
          else
            python -m newsintel --digest --period "${{ steps.period.outputs.period }}"
          fi

      - name: Commit website only if it changed
        if: always()
        run: |
          git config user.name "newsintel-bot"
          git config user.email "newsintel-bot@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Website unchanged; nothing to commit (no new Pages build)."
            exit 0
          fi
          git commit -m "Update website"
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "$BRANCH" && git push origin HEAD:"$BRANCH" && break
            echo "Push attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsintel-logs
          path: logs/newsintel.log
          if-no-files-found: ignore
