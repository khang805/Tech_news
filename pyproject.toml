[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsintel"
version = "1.0.0"
description = "Daily tech news collector with email digest and searchable archive"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
