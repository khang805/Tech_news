# Feed list for the collector.
#   enabled: true/false     turn a feed on or off
#   source_priority: 1-5    higher = more importance points (up to 25)
#   category: ""            leave empty to classify by keywords in settings.yaml
#   fetch_full_text: true   also downloads the article page (slower; 1 request/second per site)
# "Google News search" feeds collect news about a topic from many outlets (free, no key needed).
# Lines marked VERIFY had a URL that could not be confirmed when this project was built.
# Test one feed with:  python -m newsintel --feed "NAME" --no-email --verbose
