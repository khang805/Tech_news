<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Intelligence</title>
<style>
body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1d1d1f; }
header { background: #1d2b44; color: #fff; padding: 16px; }
header h1 { margin: 0; font-size: 20px; }
header .updated { font-size: 13px; opacity: .9; margin-top: 4px; line-height: 1.5; }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.controls input, .controls select { flex: 1 1 150px; padding: 9px; border: 1px solid #c8ccd4; border-radius: 6px; font-size: 14px; }
.count { font-size: 13px; color: #555; margin-bottom: 10px; }
.card { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card h3 { margin: 6px 0; font-size: 17px; }
.card a { color: #0b57d0; }
.meta { font-size: 12px; color: #666; margin: 4px 0; }
.line { font-weight: 600; font-size: 14px; margin: 8px 0 6px; }
.para { font-size: 14px; line-height: 1.5; margin: 0 0 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e6ebf5; }
.badge.High { background: #ffd7d7; }
.error { color: #a00; }
</style>
</head>
<body>
<header>
  <h1>Tech Intelligence</h1>
  <div class="updated">
    Data updated: <span id="updated-local">loading...</span> (your time)<br>
    Pakistan time: <span id="updated-pkt">loading...</span>
  </div>
</header>
<main>
<div class="controls">
<input id="q" type="search" placeholder="Search titles, summaries, sources">
<select id="period">
  <option value="1">Last day</option>
  <option value="7">Last week</option>
  <option value="30">Last month</option>
  <option value="all">All stored (30 days)</option>
</select>
<select id="impact">
  <option value="all">All impact levels</option>
  <option value="high">High Impact</option>
  <option value="other">Medium &amp; Low Impact</option>
</select>
<select id="cat"><option value="">All categories</option></select>
</div>
<div class="count" id="count">Loading...</div>
<div id="list"></div>
</main>
<script>
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
const CATEGORY_ORDER = ["NVIDIA", "Jetson & Edge AI", "GPUs & Accelerators", "AMD & Intel", "Inference Engines", "Frontier AI Labs", "China Big Tech & AI", "China AI Startups", "US & Europe AI Startups", "NLP & LLMs", "AI Agents", "Cloud (AWS, Google Cloud, Azure)", "High Performance Computing", "Big Tech"];
const HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };
const $ = (id) => document.getElementById(id);
let ARTICLES = [];

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function showUpdateTimes(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return;
  $("updated-local").textContent = d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  $("updated-pkt").textContent = d.toLocaleString("en-GB", { timeZone: "Asia/Karachi", dateStyle: "medium", timeStyle: "short" }) + " PKT";
}

async function fetchArticles() {
  // Last 30 days, newest first, 1000 rows per request (the API's page size).
  const cutoff = new Date(Date.now() - 30 * 86400000).toISOString();
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const url = SUPABASE_URL + "/rest/v1/articles?select=data&published_utc=gte." +
                encodeURIComponent(cutoff) + "&order=published_utc.desc";
    const res = await fetch(url, { headers: { ...HEADERS, Range: from + "-" + (from + 999), "Range-Unit": "items" }, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const batch = await res.json();
    batch.forEach((r) => rows.push(r.data));
    if (batch.length < 1000) break;
  }
  return rows;
}

async function fetchLastRun() {
  const res = await fetch(SUPABASE_URL + "/rest/v1/meta?select=value&key=eq.last_run_utc", { headers: HEADERS, cache: "no-store" });
  if (!res.ok) return null;
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}

function fillCategories() {
  const cats = [...new Set(ARTICLES.map((a) => a.category))];
  cats.sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a) < 0 ? 999 : CATEGORY_ORDER.indexOf(a);
    const ib = CATEGORY_ORDER.indexOf(b) < 0 ? 999 : CATEGORY_ORDER.indexOf(b);
    return ia - ib || a.localeCompare(b);
  });
  cats.forEach((c) => {
    const opt = el("option", "", c);
    opt.value = c;
    $("cat").appendChild(opt);
  });
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const days = $("period").value;
  const impact = $("impact").value;
  const cat = $("cat").value;
  const cutoff = Date.now() - (days === "all" ? Infinity : Number(days) * 86400000);
  const rows = ARTICLES.filter((a) => {
    if (Date.parse(a.published_utc) < cutoff) return false;
    if (impact === "high" && a.impact_level !== "High") return false;
    if (impact === "other" && a.impact_level === "High") return false;
    if (cat && a.category !== cat) return false;
    return !q || [a.title, a.overview, a.explanation, a.source_name, a.category].join(" ").toLowerCase().includes(q);
  });
  rows.sort((x, y) => (days === "1" ? (x.published_utc < y.published_utc ? 1 : -1) : y.importance_score - x.importance_score));
  const list = $("list");
  list.innerHTML = "";
  $("count").textContent = `${rows.length} of ${ARTICLES.length} stored stories`;
  rows.forEach((a) => {
    const card = el("div", "card");
    const title = el("h3");
    const link = el("a", "", a.title);
    link.href = a.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    title.appendChild(link);
    card.appendChild(title);
    card.appendChild(el("span", "badge " + a.impact_level, a.impact_level + " impact"));
    card.appendChild(el("span", "meta", "  " + a.category));
    card.appendChild(el("div", "meta", `${a.published_utc.replace("T", " ").slice(0, 16)} UTC | ${a.source_name} | ${a.impact_source === "ai" ? "AI" : "rules"} impact`));
    card.appendChild(el("p", "line", a.overview));
    if (a.explanation) card.appendChild(el("p", "para", a.explanation));
    list.appendChild(card);
  });
}

async function load() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    $("count").textContent = "";
    $("list").appendChild(el("p", "error", "The website is not connected to its database yet (SUPABASE_URL / SUPABASE_ANON_KEY missing)."));
    return;
  }
  try {
    const [rows, lastRun] = await Promise.all([fetchArticles(), fetchLastRun()]);
    ARTICLES = rows;
    if (lastRun) showUpdateTimes(lastRun);
    fillCategories();
    ["q", "period", "impact", "cat"].forEach((id) => $(id).addEventListener("input", render));
    render();
  } catch (err) {
    $("count").textContent = "";
    $("list").appendChild(el("p", "error", "Could not load the stories (" + err.message + "). Check the Supabase keys and the RLS policies."));
  }
}
load();
</script>
</body>
</html>
